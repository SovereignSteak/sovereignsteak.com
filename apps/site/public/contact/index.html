<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Send a private message to SovereignSteak.">
    <meta name="theme-color" content="#130f0d">
    <title>Contact · SovereignSteak</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,700;1,700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
      window.onTurnstileLoad = () => {
        window.contactTurnstileId = window.turnstile.render("#turnstile-widget", {
          sitekey: "0x4AAAAAAEMu3yVyPKbPTU2-",
          action: "contact",
          theme: "dark"
        });
      };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&amp;render=explicit" async defer></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="page-shell contact-shell">
      <header class="brand-mark" aria-label="SovereignSteak">
        <span class="brand-mark__rule"></span>
        <span class="brand-mark__monogram">SS</span>
        <span class="brand-mark__rule"></span>
      </header>

      <section class="contact" aria-labelledby="contact-title">
        <h1 id="contact-title">Get in <span>touch.</span></h1>

        <form id="contact-form" class="contact-form" action="/api/contact" method="post">
          <input id="started-at" type="hidden" name="started_at">
          <div class="honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <label for="name">Name <small>optional</small></label>
          <input id="name" name="name" type="text" maxlength="100" autocomplete="name">

          <label for="email">Reply email</label>
          <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>

          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" minlength="3" maxlength="160" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" minlength="10" maxlength="5000" rows="8" required></textarea>

          <div id="turnstile-widget" class="turnstile-widget"></div>

          <button class="contact-submit" type="submit">Send message <span aria-hidden="true">→</span></button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <a class="contact-back" href="/">← Back to SovereignSteak</a>
      </section>
    </main>

    <script>
      const form = document.getElementById("contact-form");
      const startedAt = document.getElementById("started-at");
      const status = document.getElementById("form-status");
      startedAt.value = Date.now();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button[type='submit']");
        button.disabled = true;
        status.textContent = "Sending…";
        try {
          const response = await fetch(form.action, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams(new FormData(form))
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message);
          form.reset();
          startedAt.value = Date.now();
          status.textContent = result.message;
        } catch (error) {
          status.textContent = error.message || "The message could not be sent.";
        } finally {
          if (window.turnstile && window.contactTurnstileId !== undefined) window.turnstile.reset(window.contactTurnstileId);
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
